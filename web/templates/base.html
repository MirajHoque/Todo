<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}Todo App{{end}}</title>
    <style>
        /* ── Reset & base ───────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            min-height: 100vh;
        }

        /* ── Nav ────────────────────────────────────────────────── */
        nav {
            background: #fff;
            border-bottom: 1px solid #e5e5e5;
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            text-decoration: none;
        }

        .nav-links { display: flex; gap: 12px; align-items: center; }

        .nav-links a, .nav-btn {
            font-size: 14px;
            color: #555;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            border: none;
            background: none;
            cursor: pointer;
            transition: background 0.15s;
        }

        .nav-links a:hover, .nav-btn:hover { background: #f0f0f0; color: #1a1a1a; }

        .btn-primary {
            background: #2563eb;
            color: #fff !important;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }
        .btn-primary:hover { background: #1d4ed8 !important; }

        /* ── Main container ─────────────────────────────────────── */
        .container {
            max-width: 640px;
            margin: 40px auto;
            padding: 0 16px;
        }

        /* ── Card ───────────────────────────────────────────────── */
        .card {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 28px;
            margin-bottom: 16px;
        }

        .card h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* ── Form elements ──────────────────────────────────────── */
        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #444;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #d5d5d5;
            border-radius: 6px;
            font-size: 14px;
            color: #1a1a1a;
            background: #fff;
            transition: border-color 0.15s;
            outline: none;
        }

        input:focus, select:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        .btn {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn:hover { background: #1d4ed8; }
        .btn:disabled { background: #93c5fd; cursor: not-allowed; }

        .btn-danger {
            background: none;
            border: none;
            color: #dc2626;
            cursor: pointer;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.15s;
        }
        .btn-danger:hover { background: #fef2f2; }

        /* ── Alert messages ─────────────────────────────────────── */
        .alert {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .alert.show { display: block; }
        .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

        /* ── Link ───────────────────────────────────────────────── */
        .text-link {
            font-size: 13px;
            color: #2563eb;
            text-align: center;
            margin-top: 16px;
        }
        .text-link a { color: #2563eb; }

        /* ── Loading spinner ────────────────────────────────────── */
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav>
        <a class="nav-brand" href="/">✓ Todo App</a>
        <div class="nav-links" id="nav-links">
            {{block "nav" .}}{{end}}
        </div>
    </nav>

    <div class="container">
        {{block "content" .}}{{end}}
    </div>

    {{block "scripts" .}}{{end}}
</body>
</html>
