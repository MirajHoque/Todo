{{template "base.html" .}}

{{define "title"}}Register — Todo App{{end}}

{{define "nav"}}
<a href="/">Login</a>
{{end}}

{{define "content"}}
<div class="card">
    <h1>Create account</h1>

    <div class="alert alert-error" id="error-msg"></div>

    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password">
    </div>

    <div class="form-group">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" placeholder="Repeat password" autocomplete="new-password">
    </div>

    <button class="btn" id="register-btn" onclick="register()">Create account</button>

    <div class="text-link">
        Already have an account? <a href="/">Login</a>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script>
    // If already logged in redirect to todos
    if (localStorage.getItem('token')) {
        window.location.href = '/todos';
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') register();
    });

    async function register() {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm  = document.getElementById('confirm').value;
        const btn      = document.getElementById('register-btn');

        document.getElementById('error-msg').classList.remove('show');

        // Validate
        if (!email || !password) {
            showError('Email and password are required');
            return;
        }
        if (password.length < 8) {
            showError('Password must be at least 8 characters');
            return;
        }
        if (password !== confirm) {
            showError('Passwords do not match');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Creating account...';

        try {
            const res = await fetch('/api/v1/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (!res.ok) {
                showError(data.error || 'Registration failed');
                return;
            }

            // Store token — user is automatically logged in after register
            localStorage.setItem('token', data.token);
            localStorage.setItem('user_email', data.user.email);

            window.location.href = '/todos';

        } catch (err) {
            showError('Network error — please try again');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Create account';
        }
    }

    function showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = msg;
        el.classList.add('show');
    }
</script>
{{end}}
